[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leanreviewbench"
version = "0.1.0"
description = "LeanReviewBench offline dataset loader and development evaluation tools"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
leanreviewbench = "leanreviewbench.__main__:main"

[tool.setuptools.packages.find]
include = ["leanreviewbench*"]
